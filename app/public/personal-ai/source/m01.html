<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>M01 · Frosted Glass Membership Sheet — Montserrat</title>
<!-- Montserrat Medium, OFL-1.1. Fontsource CDN provides 500 Latin weight; type remains live/editable. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/montserrat@5.2.6/latin-500.css">
<style>
:root{color-scheme:dark;font-synthesis:none}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:'Inter Display','Helvetica Neue','SF Pro Display','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif}
button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #d6b38b;outline-offset:3px}.stage{height:100dvh;min-height:400px;width:100%;overflow:hidden;position:relative;background:#293535;color:#e7ebe3;isolation:isolate}
.scenery{position:absolute;inset:-7%;background:radial-gradient(ellipse 72% 54% at 52% 37%,#b8b8b0 0%,transparent 69%),radial-gradient(ellipse 40% 63% at 8% 71%,#978d89 0%,transparent 81%),radial-gradient(ellipse 55% 70% at 88% 63%,#4e6770 0%,transparent 78%),linear-gradient(120deg,#1d3432 0%,#60756f 22%,#a3a49b 47%,#778781 69%,#1b322f 100%)}
.scenery:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#101c1b83,transparent 36%,#a7aca247 56%,#10232176 100%);filter:blur(34px)}.scenery:after{content:"";position:absolute;left:10%;top:19%;width:80%;height:78%;opacity:.47;background:repeating-linear-gradient(95deg,transparent 0 60px,#c2aaa35a 74px,transparent 90px),radial-gradient(ellipse at 50% 75%,#e6a68b85,transparent 40%);filter:blur(15px);transform:rotate(-10deg)}
.scene-under{position:absolute;z-index:1;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px}.scene-under .brand{font-size:clamp(18px,4vw,30px);letter-spacing:.2em;font-weight:620;color:#eff4ee}.scene-under .tag{font-size:12px;letter-spacing:.2em;color:#c2d1c7}.open-btn{border:1px solid #fffb;background:#edeae1;color:#1a2420;border-radius:999px;padding:13px 26px;font-size:14px;font-weight:650;box-shadow:0 6px 24px #071f1955}
.curtain{position:absolute;z-index:10;inset:0;opacity:0;visibility:hidden;pointer-events:none;transition:opacity 320ms ease,visibility 0s 320ms}.curtain.visible{opacity:1;visibility:visible;pointer-events:auto;transition:opacity 320ms ease}
.veil{position:absolute;inset:0;background:rgba(10,16,17,.06);backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px);transition:background 420ms cubic-bezier(.2,.7,.2,1),backdrop-filter 420ms cubic-bezier(.2,.7,.2,1),-webkit-backdrop-filter 420ms cubic-bezier(.2,.7,.2,1)}
.curtain.visible .veil{background:rgba(10,16,17,.22);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)}
.card-position{width:615px;height:876px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--card-scale,1));transform-origin:center center;pointer-events:none}.glass-card{position:absolute;inset:0;pointer-events:auto;border-radius:47px;background:rgba(255,255,255,.42);-webkit-backdrop-filter:blur(18px) saturate(.9);backdrop-filter:blur(18px) saturate(.9);border:1.4px solid rgba(255,255,255,.71);box-shadow:0 24px 85px rgba(10,17,18,.21),inset 0 1px 0 rgba(255,255,255,.28);opacity:0;transform:translateY(18px) scale(.94);transform-origin:center;transition:opacity 420ms cubic-bezier(.2,.7,.2,1),transform 420ms cubic-bezier(.2,.7,.2,1);color:#161516;overflow:hidden}
.curtain.visible .glass-card{opacity:1;transform:translateY(0) scale(1)}
.glass-card::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 44% 22% at 78% 17%,rgba(17,28,32,.65),transparent 95%),linear-gradient(180deg,transparent 62%,rgba(255,255,255,.02) 75%,rgba(255,255,255,.54) 100%)}.glass-card>.header,.glass-card>.remaining,.glass-card>.progress,.glass-card>.facts,.glass-card>.cta{z-index:1}
.header{position:absolute;left:40px;right:40px;top:43px;display:flex;align-items:flex-start;justify-content:space-between}.header .brand-name{font-size:26px;letter-spacing:.072em;line-height:1.1;font-weight:650}.header .subtitle{font-size:19px;line-height:1.3;font-weight:400;margin-top:5px;color:rgba(77,75,71,.58)}
.status{flex-shrink:0;background:#171515;color:#fff;border-radius:999px;width:140px;height:53px;display:flex;justify-content:center;align-items:center;gap:13px;font-size:21px;font-weight:620;letter-spacing:-.02em;white-space:nowrap}.status .mark{font-size:22px;line-height:1}
.remaining{position:absolute;left:39px;right:40px;top:153px}.remaining .number{font-family:"Montserrat","Inter Display","Helvetica Neue",sans-serif;font-size:138px;font-weight:500;letter-spacing:-.105em;line-height:.965;display:block;font-variant-numeric:tabular-nums}.remaining .label{font-size:21px;font-weight:415;line-height:1.25;color:rgba(90,84,79,.72);margin-top:9px}
.progress{position:absolute;left:40px;right:40px;top:346px;height:53px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:9px}.slot{position:relative;overflow:visible;border-radius:999px;background:rgba(246,246,244,.78);height:53px;min-width:0}.slot .inside{position:absolute;inset:0;overflow:hidden;border-radius:inherit}.slot .fill{position:absolute;inset:0;background:#d17f39;border-radius:inherit;transform:scaleY(0);transform-origin:bottom center;will-change:transform}.slot.current{outline:2px solid #22211f;outline-offset:0;z-index:2}.today{position:absolute;left:50%;top:72px;transform:translateX(-50%);font-size:19px;font-weight:500;letter-spacing:.018em;color:#1b1a1a;white-space:nowrap;font-variant-numeric:tabular-nums}
.facts{position:absolute;left:40px;right:40px;top:472px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:113px;column-gap:13px;row-gap:14px}.fact{background:rgba(255,255,255,.56);border-radius:28px;padding:21px 24px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden}.fact .key{font-size:21px;color:rgba(104,97,90,.85);font-weight:415;line-height:1.25}.fact .val{font-size:26px;color:#1b1a18;font-weight:610;line-height:1.14;white-space:nowrap;margin-top:7px;letter-spacing:-.035em}.fact .val.date{font-size:24px;font-weight:470;letter-spacing:.015em;font-variant-numeric:tabular-nums}
.cta{position:absolute;left:40px;right:40px;top:735px;height:90px;background:#171515;color:#fff;display:flex;justify-content:center;align-items:center;gap:20px;border:0;border-radius:999px;font-size:23px;font-weight:650;line-height:1;letter-spacing:-.01em}.cta .arrow{font-size:28px;font-weight:500;line-height:.8}.cta:active{transform:scale(.993)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.itinerary{position:absolute;z-index:12;inset:0;background:linear-gradient(155deg,#233833,#152522);color:#eef1e9;display:none;align-items:center;justify-content:center;flex-direction:column;gap:22px;text-align:center;padding:30px}.itinerary.show{display:flex}.itinerary .overline{font-size:12px;letter-spacing:.22em;color:#b2bfb6}.itinerary h1{font-size:54px;font-weight:570;line-height:1.2;margin:0}.itinerary p{font-size:16px;color:#baccc0}.itinerary button{border:1px solid #ffffffa9;border-radius:99px;padding:13px 24px;color:#172521;background:#e1ede0}
@media(prefers-reduced-motion:reduce){.curtain,.veil,.glass-card,.slot .fill{transition-duration:1ms!important;animation-duration:1ms!important}}
</style></head><body>
<main class="stage" id="stage">
<div class="scenery" aria-hidden="true"></div>
<div class="scene-under" aria-label="会员卡背景页面"><span class="brand">LISBON</span><span class="tag">ANNUAL TRAVEL PLAN</span><button type="button" class="open-btn" id="show">查看年度通行卡 →</button></div>
<div class="curtain" id="curtain" aria-hidden="true"><div class="veil" id="backdrop" aria-label="点击空白返回原页面"></div>
<div class="card-position" id="position"><article class="glass-card" id="card" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="cardbrand" aria-describedby="cardtype">
<header class="header"><div><div class="brand-name" id="cardbrand">LISBON</div><div class="subtitle" id="cardtype">里斯本 · 年度旅行计划</div></div><span class="status" role="status" id="state"><span class="mark" aria-hidden="true">✓</span><span id="stateText">进行中</span></span></header>
<div class="remaining"><span class="number" id="remaining">163</span><div class="label">剩余天数</div></div>
<div class="progress" id="progress" role="img" aria-label="年度有效期进度"></div>
<section class="facts" aria-label="会员信息"><div class="fact"><div class="key">下一站</div><div class="val">里斯本</div></div><div class="fact"><div class="key">年限</div><div class="val">1年</div></div><div class="fact"><div class="key">起始日期</div><div class="val date" id="startText">2026.03.10</div></div><div class="fact"><div class="key">有效期至</div><div class="val date" id="endText">2027.03.10</div></div></section>
<button class="cta" id="primary"><span>查看行程</span><span class="arrow" aria-hidden="true">→</span></button>
</article></div></div>
<section class="itinerary" id="itinerary" aria-label="行程详情"><div class="overline">LISBON · 2026 / 2027</div><h1>年度行程</h1><p>下一站 · 里斯本</p><button type="button" id="return">返回会员卡 ←</button></section>
</main>
<script>
(()=>{const $=id=>document.getElementById(id),stage=$('stage'),curtain=$('curtain'),position=$('position'),progress=$('progress');const dates={start:'2026-03-10',now:'2026-09-28',end:'2027-03-10'};const epoch=iso=>{const [y,m,d]=iso.split('-').map(Number);return Date.UTC(y,m-1,d)/86400000};const total=epoch(dates.end)-epoch(dates.start);const elapsed=Math.max(0,Math.min(total,epoch(dates.now)-epoch(dates.start)));const remaining=Math.max(0,total-elapsed);const fraction=total>0?elapsed/total:0;const fills=Array.from({length:12},(_,i)=>Math.max(0,Math.min(1,12*fraction-i)));const currentIndex=Math.min(11,Math.max(0,Math.floor(fraction*12)));const status=epoch(dates.now)<epoch(dates.start)?'未开始':epoch(dates.now)>=epoch(dates.end)?'已到期':'进行中';const displayDate=s=>s.replace(/-/g,'.');const mmdd=dates.now.slice(5).replace('-','.');$('remaining').textContent=remaining;$('stateText').textContent=status;$('startText').textContent=displayDate(dates.start);$('endText').textContent=displayDate(dates.end);$('state').setAttribute('aria-label','会员状态：'+status);
let anims=[],closeTimer=0,openRAF=0,invoker=$('show');function scale(){const s=Math.max(.25,Math.min(1,(stage.clientWidth-36)/615,(stage.clientHeight-24)/876));position.style.setProperty('--card-scale',String(s));}new ResizeObserver(scale).observe(stage);scale();function draw(){progress.replaceChildren();fills.forEach((v,i)=>{let slot=document.createElement('div');slot.className='slot'+(i===currentIndex?' current':'');slot.dataset.index=String(i);slot.dataset.fraction=String(v);let inside=document.createElement('div');inside.className='inside';let fill=document.createElement('div');fill.className='fill';inside.append(fill);slot.append(inside);if(i===currentIndex){const label=document.createElement('span');label.className='today';label.textContent=mmdd+' 今天';slot.append(label)}progress.append(slot)});progress.setAttribute('aria-label',`有效期限${total}天，已使用${elapsed}天，剩余${remaining}天，${mmdd}为今天`)}draw();function cleanup(){anims.forEach(a=>a.cancel());anims=[];clearTimeout(closeTimer);cancelAnimationFrame(openRAF)}function fill(){const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;progress.querySelectorAll('.slot').forEach((slot,i)=>{const inner=slot.querySelector('.fill'),target=fills[i];inner.style.transform='scaleY(0)';if(target===0)return;if(reduce){inner.style.transform=`scaleY(${target})`;return;}const a=inner.animate([{transform:'scaleY(0)'},{transform:`scaleY(${target})`}],{duration:267,delay:240+i*1000/15,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'});anims.push(a);});}function open(){cleanup();$('itinerary').classList.remove('show');curtain.setAttribute('aria-hidden','false');curtain.style.visibility='visible';curtain.style.pointerEvents='auto';curtain.classList.remove('visible');progress.querySelectorAll('.fill').forEach(e=>e.style.transform='scaleY(0)');openRAF=requestAnimationFrame(()=>{curtain.classList.add('visible');fill();$('card').focus({preventScroll:true})})}function dismiss(){cleanup();curtain.classList.remove('visible');curtain.setAttribute('aria-hidden','true');closeTimer=setTimeout(()=>{curtain.style.visibility='hidden';curtain.style.pointerEvents='none';progress.querySelectorAll('.fill').forEach(e=>e.style.transform='scaleY(0)');invoker?.focus?.({preventScroll:true})},350)}$('show').addEventListener('click',()=>{invoker=$('show');open()});$('backdrop').addEventListener('click',e=>{if(e.target===$('backdrop'))dismiss()});$('primary').addEventListener('click',()=>{cleanup();curtain.classList.remove('visible');curtain.setAttribute('aria-hidden','true');curtain.style.pointerEvents='none';curtain.style.visibility='hidden';$('itinerary').classList.add('show');$('return').focus()});$('return').addEventListener('click',()=>open());document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('itinerary').classList.contains('show')){$('itinerary').classList.remove('show');$('show').focus()}else if(curtain.classList.contains('visible'))dismiss()}});window.addEventListener('popstate',()=>{if(curtain.classList.contains('visible'))dismiss()});window.__m01={dates,total,elapsed,remaining,fraction,fills,currentIndex,open,dismiss};setTimeout(open,150);
})();
</script></body></html>
