server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location /personal-registry/ { try_files $uri =404; }
    location /open-libraries/ { try_files $uri =404; }
    location /integrations/motion-vault/ { try_files $uri =404; add_header Access-Control-Allow-Origin "*" always; add_header Content-Security-Policy "sandbox allow-scripts; default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self'; base-uri 'none'; form-action 'none'" always; }
    location /personal-ai/source/ { try_files $uri =404; add_header Content-Security-Policy "sandbox; default-src 'none'" always; }
    location /personal-ai/demos/ { try_files $uri =404; add_header Content-Security-Policy "sandbox allow-scripts; default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'" always; }
    location /personal-ai/entries/ { try_files $uri =404; }
    location /personal-ai/posters/ { try_files $uri =404; }
    location = /personal-ai/NOTICE.txt { try_files $uri =404; }
    location /motion-prompts/entries/ { try_files $uri =404; }
    location /motion-prompts/prompts/ { try_files $uri =404; }
    location = /motion-prompts/LICENSE.txt { try_files $uri =404; }
    location = /motion-prompts/NOTICE.txt { try_files $uri =404; }
    location = /motion-prompts/manifest.json { try_files $uri =404; }
    location /r/ { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}
